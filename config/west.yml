manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
      # Additional modules containing boards/shields/custom code can be listed here as well.
      # See:
      # - https://zmk.dev/docs/features/modules
      # - https://docs.zephyrproject.org/3.5.0/develop/west/manifest.html#projects
    - name: m165437 #new entry
      url-base: https://github.com/M165437 #new entry
  projects:
    - name: nice-view-gem #new entry
      remote: m165437 #new entry
      revision: v0.3.0 # must match the ZMK release below
    - name: zmk
      remote: zmkfirmware
      # v0.3.0 is the last Zephyr 3.5 release; the board files in boards/arm/
      # don't build on ZMK main (Zephyr 4.1). Keep in sync with build.yml.
      revision: v0.3.0
      import: app/west.yml
  self:
    path: config
